<!DOCTYPE html>
<html>
<head>
    <title>AI Image Generator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container main-box" data-aos="zoom-in">

    <h1 class="title">🎨 AI Image Generator</h1>

    <!-- FORM -->
    <form method="POST" onsubmit="showLoader()">
        <input type="text" name="prompt" class="form-control input-box" placeholder="Describe your image..." required>
        <button class="btn btn-gradient mt-3">🚀 Generate</button>
    </form>

    <!-- LOADER -->
    <div id="loader" class="loader mt-4" style="display:none;">
        ⏳ Generating AI Image...
    </div>

    <!-- ERROR MESSAGE -->
    {% if error %}
    <div class="alert alert-danger mt-3" data-aos="fade-down">
        ❌ {{ error }}
    </div>
    {% endif %}

    <!-- IMAGE RESULT -->
    {% if image %}
    <div class="mt-4" data-aos="fade-up">
        <h4>✨ Generated Image:</h4>
        <img src="data:image/png;base64,{{ image }}" class="img-fluid result-img">
    </div>
    {% endif %}

</div>

<!-- JS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init();

function showLoader() {
    document.getElementById("loader").style.display = "block";
}
</script>

</body>
</html>
